# Usage:  copy .env.example to .env, edit it, then:  docker compose up -d
services:
  live-poll:
    image: ${IMAGE:-thirudocker004/live-poll}:${TAG:-latest}
    container_name: live-poll-${APP_ENV:-dev}
    ports:
      - "${HOST_PORT:-4000}:3000"
    env_file:
      - .env
    restart: unless-stopped
