<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Poll</title>
<style>
  :root {
    --bg:#f2f4f8; --card:#ffffff; --ink:#16213a; --muted:#66728c; --line:#dde2ec;
    --bar:#dfe6f5; --pick:#2747d1; --pick-ink:#ffffff;
    --dev:#c27a00; --prod:#17803d; --other:#6a4fc4;
    font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#10162a; --card:#1a2240; --ink:#eef1fa; --muted:#98a3c2; --line:#2a345a; --bar:#27325c; --pick:#7b95ff; --pick-ink:#0d1330; --dev:#f0b24a; --prod:#52c27a; --other:#b49cff; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); min-height:100vh; }
  button { font:inherit; color:inherit; }
  :focus-visible { outline:2px solid var(--pick); outline-offset:2px; }

  #banner { padding:.45rem 1rem; text-align:center; font-size:.8rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:#fff; background:var(--other); }
  #banner.dev { background:var(--dev); } #banner.prod { background:var(--prod); }

  main { max-width:38rem; margin:0 auto; padding:1.5rem 1.1rem 3rem; }
  h1 { font-size:1.55rem; line-height:1.25; margin:.4rem 0 .35rem; letter-spacing:-.01em; }
  .meta { display:flex; gap:1rem; color:var(--muted); font-size:.88rem; margin-bottom:1.1rem; flex-wrap:wrap; }
  .dot { display:inline-block; width:.55rem; height:.55rem; border-radius:50%; background:#c0392b; margin-right:.35rem; }
  .dot.on { background:#27ae60; }

  .opt { position:relative; display:block; width:100%; text-align:left; margin-bottom:.6rem; padding:0; border:1px solid var(--line); border-radius:12px; background:var(--card); cursor:pointer; overflow:hidden; }
  .opt .fill { position:absolute; inset:0 auto 0 0; width:0; background:var(--bar); transition:width .45s ease; }
  .opt .row { position:relative; display:flex; justify-content:space-between; gap:1rem; padding:.95rem 1rem; }
  .opt.mine { border-color:var(--pick); box-shadow:0 0 0 1px var(--pick) inset; }
  .opt.mine .fill { background:color-mix(in srgb, var(--pick) 30%, transparent); }
  .opt .pct { font-variant-numeric:tabular-nums; color:var(--muted); }
  .hint { color:var(--muted); font-size:.85rem; margin-top:1rem; }
  #err { color:#c0392b; min-height:1.2rem; font-size:.9rem; }
  @media (prefers-reduced-motion: reduce) { .opt .fill { transition:none; } }
</style>
</head>
<body>
<div id="banner">connecting…</div>
<main>
  <h1 id="question">&nbsp;</h1>
  <div class="meta">
    <span><span class="dot" id="dot"></span><span id="status">connecting</span></span>
    <span><b id="viewers">0</b> watching</span>
    <span><b id="total">0</b> votes</span>
  </div>
  <div id="options" role="group" aria-label="Poll options"></div>
  <div id="err" role="status"></div>
  <p class="hint">Click an option to vote. Click another to change your vote. Everyone sees results update live.</p>
</main>

<script src="/socket.io/socket.io.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const socket = io();
  let options = [], mine = null, last = { counts: {}, total: 0, viewers: 0 };

  fetch('/config').then((r) => r.json()).then((cfg) => {
    options = cfg.options;
    $('question').textContent = cfg.question;
    const b = $('banner');
    b.textContent = `${cfg.appEnv} environment`;
    b.className = ['dev', 'prod'].includes(cfg.appEnv) ? cfg.appEnv : '';
    document.title = `Live Poll (${cfg.appEnv})`;
    build(); paint();
  }).catch(() => { $('err').textContent = 'Could not load config'; });

  function build() {
    $('options').replaceChildren(...options.map((o) => {
      const b = document.createElement('button');
      b.className = 'opt'; b.dataset.option = o;
      const fill = Object.assign(document.createElement('span'), { className: 'fill' });
      const row = document.createElement('span'); row.className = 'row';
      row.append(Object.assign(document.createElement('span'), { className: 'label', textContent: o }),
                 Object.assign(document.createElement('span'), { className: 'pct' }));
      b.append(fill, row);
      b.addEventListener('click', () => { mine = o; socket.emit('vote', o); paint(); });
      return b;
    }));
  }

  function paint() {
    $('total').textContent = last.total;
    $('viewers').textContent = last.viewers;
    document.querySelectorAll('.opt').forEach((el) => {
      const n = last.counts[el.dataset.option] || 0;
      const pct = last.total ? Math.round((n / last.total) * 100) : 0;
      el.querySelector('.fill').style.width = pct + '%';
      el.querySelector('.pct').textContent = `${n} · ${pct}%`;
      el.classList.toggle('mine', el.dataset.option === mine);
      el.setAttribute('aria-pressed', el.dataset.option === mine);
    });
  }

  socket.on('connect', () => { $('dot').classList.add('on'); $('status').textContent = 'live'; });
  socket.on('disconnect', () => { $('dot').classList.remove('on'); $('status').textContent = 'reconnecting…'; mine = null; });
  socket.on('results', (r) => { last = r; paint(); });
  socket.on('reset', () => { mine = null; paint(); });
</script>
</body>
</html>
